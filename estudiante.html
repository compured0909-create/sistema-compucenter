<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Estudiantil | COMPURED</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .panel-section { display: none !important; }
        .panel-section.active { display: block !important; }
        .sidebar-nav a.active { background: rgba(0, 242, 254, 0.15); color: #00f2fe; border-left: 4px solid #00f2fe; }
        .bloqueo-notas {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #ff4757;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body class="dashboard-body">

    <aside class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between;">
        <div>
            <div class="sidebar-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px;">
                <img src="logo.png" alt="Logo" style="width: 30px; height: auto;">
                <span>COMPURED</span>
            </div>
            <div style="padding: 12px; text-align: center; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <p id="lblNombreEstudiante" style="color: #fff; font-weight: bold; font-size: 0.9rem; margin: 0;">Estudiante</p>
                <span id="lblSedeEstudiante" style="font-size: 0.7rem; background: rgba(0,242,254,0.2); color: #00f2fe; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px;">Sede</span>
            </div>
            <nav class="sidebar-nav" style="display: flex; flex-direction: column;">
                <a href="#" onclick="mostrarSeccion('perfil', event)" class="nav-link active" style="padding: 12px 15px; color:#fff; text-decoration:none; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-id-card"></i> Mi Ficha y Curso</a>
                <a href="#" onclick="mostrarSeccion('calificaciones', event)" class="nav-link" style="padding: 12px 15px; color:#fff; text-decoration:none; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-graduation-cap"></i> Mis Calificaciones</a>
                <a href="#" onclick="mostrarSeccion('pagos', event)" class="nav-link" style="padding: 12px 15px; color:#fff; text-decoration:none; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-money-bill-wave"></i> Estado de Pagos</a>
            </nav>
        </div>

        <div style="padding: 12px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2);">
            <span style="font-size: 0.65rem; color: #94a3b8; display: block; text-transform: uppercase;">Ciclo Escolar</span>
            <h2 id="lblAnioEstudiante" style="color: #00f2fe; font-size: 1.5rem; margin: 0; font-weight: 800;">2026</h2>
            <a href="login.html" class="logout" style="margin-top: 8px; display: block; color: #ff4757; text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        </div>
    </aside>

    <main class="dashboard-content">
        <section id="perfil" class="panel-section active">
            <h2><i class="fa-solid fa-id-card"></i> Información del Estudiante</h2>
            <div class="card-form" style="max-width: 700px; margin: 0 auto; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;" id="datosPerfilEstudiante">
                    <p style="text-align: center; grid-column: span 2;">Cargando perfil...</p>
                </div>
            </div>
        </section>

        <section id="calificaciones" class="panel-section">
            <h2><i class="fa-solid fa-graduation-cap"></i> Mis Calificaciones</h2>
            <div class="card-table" id="contenedorContenidoCalificaciones">
                <p style="text-align: center;">Cargando calificaciones...</p>
            </div>
        </section>

        <section id="pagos" class="panel-section">
            <h2><i class="fa-solid fa-money-bill-wave"></i> Estado de Cuenta y Pagos</h2>
            <div class="card-table">
                <table class="data-table">
                    <thead><tr><th>Concepto / Mes</th><th>Estado / Monto (Q)</th></tr></thead>
                    <tbody id="bodyPagosEstudiante"><tr><td colspan="2" style="text-align: center;">Cargando...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhYUtjMpqbbWUGkf_oRE-Di__tbZD-9So",
            authDomain: "plataforma-educativa-compured.firebaseapp.com",
            projectId: "plataforma-educativa-compured",
            storageBucket: "plataforma-educativa-compured.firebasestorage.app",
            messagingSenderId: "495196813256",
            appId: "1:495196813256:web:d1c74002e0ca46943732fd",
            measurementId: "G-TRZ37G6SRM"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const mesesDisponibles = [
            { id: 'inscripcion', label: 'Inscripción' }, { id: 'enero', label: 'Enero' }, { id: 'feb', label: 'Febrero' },
            { id: 'marzo', label: 'Marzo' }, { id: 'abril', label: 'Abril' }, { id: 'mayo', label: 'Mayo' },
            { id: 'junio', label: 'Junio' }, { id: 'julio', label: 'Julio' }, { id: 'agosto', label: 'Agosto' },
            { id: 'septiembre', label: 'Septiembre' }, { id: 'octubre', label: 'Octubre' }, { id: 'noviembre', label: 'Noviembre' }, { id: 'diciembre', label: 'Diciembre' }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            if(localStorage.getItem('rolUsuario') !== 'estudiante') {
                alert("Acceso no autorizado.");
                window.location.href = "login.html";
                return;
            }
            const alumnoId = localStorage.getItem('alumnoId');
            if(!alumnoId) { window.location.href = "login.html"; return; }

            try {
                // 1. Cargar datos del alumno
                const snap = await getDoc(doc(db, "alumnos", alumnoId));
                if(!snap.exists()) { alert("Estudiante no encontrado."); return; }
                const a = snap.data();

                // 2. Cargar configuración de meses activos y requisitos de unidades
                const configPagosSnap = await getDoc(doc(db, "configuracion", "cicloPagos"));
                let mesesActivos = configPagosSnap.exists() ? configPagosSnap.data().mesesActivos : mesesDisponibles.map(m => m.id);

                const reqSnap = await getDoc(doc(db, "configuracion", "requisitosUnidades"));
                let requisitosUnidades = reqSnap.exists() ? reqSnap.data() : {
                    u1: ['inscripcion', 'feb', 'marzo', 'abril'],
                    u2: ['mayo', 'junio'],
                    u3: ['julio', 'agosto', 'septiembre'],
                    u4: ['octubre', 'noviembre', 'diciembre']
                };

                let nombresArray = [a.primerNombre, a.segundoNombre, a.tercerNombre, a.primerApellido, a.segundoApellido];
                let nombreCompleto = nombresArray.filter(Boolean).join(" ");
                let cicloEst = a.ciclo || "2026";

                document.getElementById('lblNombreEstudiante').innerText = nombreCompleto;
                document.getElementById('lblSedeEstudiante').innerText = a.sede;
                document.getElementById('lblAnioEstudiante').innerText = cicloEst;

                document.getElementById('datosPerfilEstudiante').innerHTML = `
                    <div><strong>Código:</strong> ${a.codigo}</div>
                    <div><strong>Ciclo Escolar:</strong> ${cicloEst}</div>
                    <div style="grid-column: span 2;"><strong>Nombre Completo:</strong> ${nombreCompleto}</div>
                    <div><strong>Curso:</strong> ${a.curso}</div>
                    <div><strong>Grado:</strong> ${a.grado}</div>
                    <div><strong>Sede:</strong> ${a.sede}</div>
                    <div><strong>Jornada:</strong> ${a.tipoJornada} (${a.diaEstudio})</div>
                    <div><strong>Horario:</strong> ${a.horaIngreso} - ${a.horaSalida}</div>
                    <div><strong>Encargado:</strong> ${a.encargado} (${a.telEncargado})</div>
                `;

                let n = a.notas || {u1:0,u2:0,u3:0,u4:0};
                let p = a.pagos || {};

                // Mapa rápido para obtener el nombre legible de cada mes a partir de su ID
                let mapaNombresMeses = {};
                mesesDisponibles.forEach(m => { mapaNombresMeses[m.id] = m.label; });

                // Función que verifica la unidad y recopila exactamente qué meses faltan (de entre los activos y requeridos)
                function obtenerMesesFaltantesUnidad(unidadKey) {
                    let mesesReq = requisitosUnidades[unidadKey] || [];
                    let faltantes = [];

                    for(let mId of mesesReq) {
                        // Solo evaluamos el mes si está activado globalmente en la plataforma y no ha sido pagado
                        if(mesesActivos.includes(mId)) {
                            if(!p[mId] || Number(p[mId]) <= 0) {
                                faltantes.push(mapaNombresMeses[mId] || mId);
                            }
                        }
                    }
                    return faltantes;
                }

                let htmlCalif = `<table class="data-table">
                    <thead><tr><th>Curso</th><th>1ra U</th><th>2da U</th><th>3ra U</th><th>4ta U</th><th>Promedio</th></tr></thead>
                    <tbody>
                    <tr>
                        <td>${a.curso}</td>`;

                let faltantesU1 = obtenerMesesFaltantesUnidad('u1');
                let faltantesU2 = obtenerMesesFaltantesUnidad('u2');
                let faltantesU3 = obtenerMesesFaltantesUnidad('u3');
                let faltantesU4 = obtenerMesesFaltantesUnidad('u4');

                let u1Val = (faltantesU1.length === 0) ? n.u1 : `<i class="fa-solid fa-lock"></i> Bloqueado`;
                let u2Val = (faltantesU2.length === 0) ? n.u2 : `<i class="fa-solid fa-lock"></i> Bloqueado`;
                let u3Val = (faltantesU3.length === 0) ? n.u3 : `<i class="fa-solid fa-lock"></i> Bloqueado`;
                let u4Val = (faltantesU4.length === 0) ? n.u4 : `<i class="fa-solid fa-lock"></i> Bloqueado`;

                let notasNumericas = [];
                if(faltantesU1.length === 0) notasNumericas.push(Number(n.u1));
                if(faltantesU2.length === 0) notasNumericas.push(Number(n.u2));
                if(faltantesU3.length === 0) notasNumericas.push(Number(n.u3));
                if(faltantesU4.length === 0) notasNumericas.push(Number(n.u4));

                let promTexto = notasNumericas.length > 0 ? (notasNumericas.reduce((acc, val) => acc + val, 0) / notasNumericas.length).toFixed(1) : "---";

                htmlCalif += `<td>${u1Val}</td><td>${u2Val}</td><td>${u3Val}</td><td>${u4Val}</td><td><strong>${promTexto}</strong></td></tr></tbody></table>`;

                // Construir mensajes de advertencia específicos indicando exactamente qué meses debe por unidad bloqueada
                let mensajesBloqueoHtml = "";
                let unidadesConDeuda = [
                    { nombre: '1ra Unidad', faltantes: faltantesU1 },
                    { nombre: '2da Unidad', faltantes: faltantesU2 },
                    { nombre: '3ra Unidad', faltantes: faltantesU3 },
                    { nombre: '4ta Unidad', faltantes: faltantesU4 }
                ];

                unidadesConDeuda.forEach(item => {
                    if(item.faltantes.length > 0) {
                        mensajesBloqueoHtml += `<div class="bloqueo-notas">
                            <i class="fa-solid fa-triangle-exclamation"></i> <strong>${item.nombre} bloqueada:</strong> Para ver esta nota, debes estar al día con los meses activos requeridos. Tienes pendiente de cancelar: <strong>${item.faltantes.join(', ')}</strong>.
                        </div>`;
                    }
                });

                htmlCalif += mensajesBloqueoHtml;
                document.getElementById('contenedorContenidoCalificaciones').innerHTML = htmlCalif;

                // Renderizar Estado de Pagos
                let htmlP = "";
                mesesDisponibles.forEach(m => {
                    if(mesesActivos.includes(m.id)) {
                        let val = p[m.id];
                        let estado = val ? `<span style="color:#25D366; font-weight:bold;">Pagado (Q. ${val})</span>` : `<span style="color:#ff4757; font-weight:bold;">Pendiente</span>`;
                        htmlP += `<tr><td>${m.label}</td><td>${estado}</td></tr>`;
                    }
                });

                let eCargos = a.cargosExtras || {};
                let keysExtras = Object.keys(eCargos);
                if(keysExtras.length > 0) {
                    htmlP += `<tr><td colspan="2" style="background: rgba(0,242,254,0.1); color: #00f2fe; font-weight: bold; text-align: center;">Cargos Extras / Gastos Pendientes</td></tr>`;
                    keysExtras.forEach(key => {
                        let objVal = eCargos[key];
                        let montoTotal = typeof objVal === 'object' ? objVal.monto : objVal;
                        let montoPagado = typeof objVal === 'object' ? objVal.pagado : '';

                        let estadoExtra = "";
                        if(montoPagado && Number(montoPagado) >= Number(montoTotal)) {
                            estadoExtra = `<span style="color:#25D366; font-weight:bold;">Pagado (Q. ${montoPagado})</span>`;
                        } else if(montoPagado && Number(montoPagado) > 0) {
                            estadoExtra = `<span style="color:#f39c12; font-weight:bold;">Abonado: Q. ${montoPagado} / Debe: Q. ${montoTotal}</span>`;
                        } else {
                            estadoExtra = `<span style="color:#ff4757; font-weight:bold;">Pendiente (Debe: Q. ${montoTotal})</span>`;
                        }

                        htmlP += `<tr><td><i class="fa-solid fa-receipt"></i> ${key}</td><td>${estadoExtra}</td></tr>`;
                    });
                }

                document.getElementById('bodyPagosEstudiante').innerHTML = htmlP;

            } catch(e) { console.error(e); }
        });
    </script>
    <script>
        function mostrarSeccion(id, evt) {
            evt.preventDefault();
            document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
