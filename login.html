<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | COMPURED</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body" style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; margin: 0;">

    <div class="card-form" style="width: 100%; max-width: 400px; padding: 30px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="logo.png" alt="Logo" style="width: 50px; margin-bottom: 10px;">
            <h2 style="color: #fff; font-size: 1.5rem;">Plataforma Educativa</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Ingrese sus credenciales de acceso</p>
        </div>

        <form id="formLogin">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; color: #fff; font-size: 0.9rem;">Usuario / Correo o Código</label>
                <input type="text" id="loginUsuario" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; color: #fff; font-size: 0.9rem;">Contraseña</label>
                <input type="password" id="loginPassword" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--primary-color); color: #0f172a; font-weight: bold; cursor: pointer;">Ingresar al Sistema</button>
        </form>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const userInput = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const passInput = document.getElementById('loginPassword').value.trim();

            // 1. Validar Director Maestro
            if((userInput === 'compured0909@gmail.com' && passInput === 'CompuRed123') || (userInput === 'director' && passInput === 'director2026')) {
                localStorage.setItem('rolUsuario', 'director');
                window.location.href = 'director.html';
                return;
            }

            try {
                // 2. Validar Docentes en Firestore
                const docentesSnapshot = await getDocs(collection(db, "docentes"));
                let docenteEncontrado = false;

                docentesSnapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    let correoDb = (d.correo || "").trim().toLowerCase();
                    let nombreDb = (d.nombre || "").trim().toLowerCase();
                    let passDb = (d.password || "").trim();

                    if ((correoDb === userInput || nombreDb === userInput) && passDb === passInput) {
                        docenteEncontrado = true;
                        localStorage.setItem('rolUsuario', 'docente');
                        localStorage.setItem('idUsuarioDocente', docSnap.id);
                        localStorage.setItem('nombreDocente', d.nombre);
                        localStorage.setItem('sedeDocente', d.sede || 'COMPURED');
                        window.location.href = 'docente.html';
                    }
                });

                if (docenteEncontrado) return;

                // 3. Validar Alumnos (Estudiantes) en Firestore
                const alumnosSnapshot = await getDocs(collection(db, "alumnos"));
                let alumnoEncontrado = false;

                alumnosSnapshot.forEach((docSnap) => {
                    let a = docSnap.data();
                    let usuarioDb = (a.usuarioAcceso || "").trim().toLowerCase();
                    let passDb = (a.passwordAcceso || "").trim();

                    if (usuarioDb === userInput && passDb === passInput) {
                        alumnoEncontrado = true;
                        localStorage.setItem('rolUsuario', 'estudiante');
                        localStorage.setItem('alumnoId', docSnap.id);
                        window.location.href = 'estudiante.html';
                    }
                });

                if (alumnoEncontrado) return;

                alert("❌ Usuario o contraseña incorrectos. Verifique sus datos.");

            } catch (error) {
                console.error("Error en el login:", error);
                alert("Ocurrió un error al intentar iniciar sesión. Verifique su conexión.");
            }
        });
    </script>
</body>
</html>
